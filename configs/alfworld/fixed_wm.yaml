# Fixed WM -- alfworld
# Paper: Table 2; Tables 10-11.
name: "Fixed WM"
arm: wmppo
iters: 55
fork: warmup       # start from the shared warm-up checkpoint (iteration 12, same task order)
runs:              # paper run (the k-th run of this method in the paper) -> --seed
  1: 0
args:              # alf_final.py arguments of the reported runs (all others keep their defaults)
  scale: 0.5
  eval-every: 3
  sib-weight: 1
  k-alt: 8
  distill-nu: 1
  calib-min: 20
  calib-window: 4
  calib-lcb-until: 14
world_model: fixed   # the initial world model, never updated
layout:            # GPUs: one per inference server (two for the 32B teacher), plus the trainers
  policy_servers: 1
  wm_servers: 2
  trainer_gpus: 2
  wm_trainer_gpus: 0
workers: 48
evaluate: [24, 36, 55]   # iterations evaluated in the paper
