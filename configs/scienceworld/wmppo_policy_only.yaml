# WM-PPO (policy channel only) -- scienceworld
# Paper: Table 2; Tables 12-13.
name: "WM-PPO (policy channel only)"
arm: wmppo
iters: 60
fork: warmup       # start from the shared warm-up checkpoint (iteration 12, same task order)
runs:              # paper run (the k-th run of this method in the paper) -> --seed
  1: 0
  2: 1
  3: 2
args:              # alf_final.py arguments of the reported runs (all others keep their defaults)
  scale: 0.5
  eval-every: 3
  sib-weight: 1
  k-alt: 8
  distill-nu: 1
  calib-min: 20
  calib-window: 4
  calib-lcb-until: 14
  wm-online: true
  wm-lr: 5.0e-5
world_model: online  # starts from the initial world model, updated every iteration
layout:            # GPUs: one per inference server (two for the 32B teacher), plus the trainers
  policy_servers: 1
  wm_servers: 2
  trainer_gpus: 2
  wm_trainer_gpus: 2
workers: 48
evaluate: [24, 36, 48, 60]   # iterations evaluated in the paper
