# Shared PPO warm-up (iterations 1-12, 64 levels each) -- sokoban
# Paper: Appendix E.6.
# The paper runs start from the released warm-up checkpoint; this config retrains a warm-up with the same budget.
name: "Shared PPO warm-up (iterations 1-12, 64 levels each)"
arm: ppo
iters: 12
fork: none
phases:            # the warm-up: (last iteration, arguments that differ between phases)
  - {iters: 12, scale: 0.5}
runs:              # paper run (the k-th run of this method in the paper) -> --seed
  1: 0
args:              # alf_final.py arguments of the reported runs (all others keep their defaults)
  max-new-tokens: 1024
  max-steps: 15
world_model: none
layout:            # GPUs: one per inference server (two for the 32B teacher), plus the trainers
  policy_servers: 2
  trainer_gpus: 4
workers: 64
sglang_extra: "--cuda-graph-max-bs=96"
